<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Pure Deep Black Background -->
  <rect width="1000" height="1000" fill="#000000" />

  <!-- Main FO Monogram (Slightly smaller, centered, no glow/shadow effects) -->
  <g id="fo-monogram" transform="translate(500, 385) scale(0.84)">
    <!-- O Element (Dark/Burnt Orange Geometric Stadium, Slanted, Interlocking slightly behind F) -->
    <g transform="translate(68, 65) skewX(-17)">
      <rect
        x="-105"
        y="-155"
        width="210"
        height="310"
        rx="95"
        ry="95"
        fill="#000000"
        stroke="#FA5A00"
        stroke-width="32"
        stroke-linejoin="round"
      />
    </g>

    <!-- F Element (Bright White Sharp Angular Esports Cut, Slanted, In Front) -->
    <g transform="translate(-85, -60) skewX(-17)">
      <path
        d="M -110, -170
           L 130, -170
           L 130, -100
           L -35, -100
           L -35, -30
           L 75, -30
           L 75, 35
           L -35, 35
           L -35, 175
           L -110, 175
           Z"
        fill="#000000"
        stroke="#FFFFFF"
        stroke-width="30"
        stroke-linejoin="miter"
        stroke-miterlimit="4"
      />
    </g>
  </g>

  <!-- Title Text: FIZZ OUT (Moved lower with clear breathing room below the logo) -->
  <g transform="translate(500, 730) skewX(-14)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="'Chakra Petch', 'Montserrat', 'Arial Black', sans-serif"
      font-weight="800"
      font-style="italic"
      font-size="80"
      letter-spacing="5"
    >FIZZ OUT</text>
  </g>

  <!-- Tagline: EVERY TOPIC IS A BATTLE. EVERY ARGUMENT IS A WEAPON. (All caps with increased font size) -->
  <g transform="translate(500, 792)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      fill="#FA5A00"
      font-family="'Outfit', 'Montserrat', system-ui, sans-serif"
      font-weight="800"
      font-size="28"
      letter-spacing="0.8"
    >EVERY TOPIC IS A BATTLE. EVERY ARGUMENT IS A WEAPON.</text>
  </g>
</svg>
